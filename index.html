<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="N!che">
<meta name="theme-color" content="#f6f1ea">
<title>N!che</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f6f1ea;
    --card: #ffffff;
    --ink: #1f1a17;
    --muted: #7a6f66;
    --line: #e6ddd2;
    --accent: #d9481c;
    --accent-soft: #fbe4da;
    --chip: #efe7dd;
    --ok: #2f7d4f;
    --shadow: 0 1px 2px rgba(31,26,23,.06), 0 6px 18px rgba(31,26,23,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161311;
      --card: #211d1a;
      --ink: #f3ece4;
      --muted: #a89c91;
      --line: #342e29;
      --accent: #ff7a4d;
      --accent-soft: #3a2219;
      --chip: #2c2622;
      --ok: #6fcf97;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 Inter, system-ui, -apple-system, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  header { padding: 20px 0 8px; }
  h1 {
    font-family: Fraunces, Georgia, serif;
    font-weight: 800;
    font-size: 34px;
    letter-spacing: -.5px;
    margin: 0;
  }
  h1 { font-family: "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif; font-style: normal; font-weight: 800; font-size: 52px; letter-spacing: -1px; line-height: .95; }
  h1 .bang { display: inline-block; transform: rotate(6deg); }
  h1 .beta { font: 600 11px/1 Inter, system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 4px 7px; border-radius: 999px; vertical-align: super; font-style: normal; }
  .tagline { font-weight: 500; font-size: 17px; line-height: 1.3; margin-top: 6px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .search {
    width: 100%;
    margin: 14px 0 10px;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 16px;
  }
  .row { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 6px; }
  .chip {
    flex: none;
    border: 1px solid transparent;
    background: var(--chip);
    color: var(--ink);
    padding: 7px 12px;
    border-radius: 999px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.on { background: var(--accent); color: #fff; }
  select.chip { appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 6px; color: var(--muted); font-size: 14px; }
  .linkbtn { background: none; border: 0; color: var(--accent); font: inherit; font-size: 14px; cursor: pointer; padding: 0; }
  .list { display: grid; gap: 12px; }
  @media (min-width: 720px) { .list { grid-template-columns: 1fr 1fr; } body { max-width: 980px; margin: 0 auto; } }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    transition: transform .25s, box-shadow .25s;
  }
  .card.pick { outline: 3px solid var(--accent); transform: scale(1.01); }
  .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .name { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 19px; line-height: 1.2; }
  .price { font-weight: 600; color: var(--accent); white-space: nowrap; }
  .price .off { color: var(--line); }
  .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { background: var(--chip); padding: 3px 9px; border-radius: 999px; font-size: 12.5px; }
  .tag.status { background: var(--accent-soft); color: var(--accent); }
  .tag.status.done { color: var(--ok); background: transparent; border: 1px solid var(--ok); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    padding: 9px 10px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
  }
  .go { background: var(--ink); color: var(--bg); }
  .ig { background: var(--chip); color: var(--ink); }
  .empty, .msg { text-align: center; color: var(--muted); padding: 40px 10px; }
  .msg code { background: var(--chip); padding: 2px 6px; border-radius: 6px; }
  .fab {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom));
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 999px;
    padding: 14px 22px;
    font: inherit;
    font-weight: 600;
    font-size: 16px;
    box-shadow: 0 8px 24px rgba(217,72,28,.35);
    cursor: pointer;
  }
  .hidden { display: none !important; }
  .userbar { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; margin-top: 4px; }
  .auth { max-width: 420px; margin: 24px auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px 18px; box-shadow: var(--shadow); }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs .chip { flex: 1; text-align: center; }
  .auth label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .auth input { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 16px; }
  .auth .submit { width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; font-size: 16px; cursor: pointer; }
  .auth .submit:disabled { opacity: .6; }
  .auth .err { color: var(--accent); font-size: 14px; margin-top: 10px; min-height: 1em; }
  .auth .hint { color: var(--muted); font-size: 13px; margin-top: 12px; }
  /* ===== Portail de connexion ===== */
  body.portal {
    min-height: 100vh;
    color: #fff;
    background-color: #17110e;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(255,170,90,.35) 0, transparent 22%),
      radial-gradient(circle at 88% 12%, rgba(255,214,140,.22) 0, transparent 18%),
      radial-gradient(circle at 78% 82%, rgba(217,72,28,.35) 0, transparent 26%),
      radial-gradient(circle at 20% 90%, rgba(255,190,120,.18) 0, transparent 20%),
      radial-gradient(ellipse at 50% 40%, #2a1d16 0, #17110e 70%);
    background-attachment: fixed;
  }
  body.portal header { text-align: center; padding: 12vh 0 6px; }
  body.portal h1 { font-size: clamp(72px, 22vw, 120px); color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.45); }
  body.portal h1 .beta { vertical-align: top; background: rgba(255,255,255,.14); color: #fff; }
  body.portal .tagline { font-size: 19px; color: #fff; }
  body.portal .sub { color: rgba(255,255,255,.7); }
  body.portal .auth {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }
  body.portal .auth label, body.portal .auth .hint { color: rgba(255,255,255,.7); }
  body.portal .auth input { background: rgba(0,0,0,.28); border-color: rgba(255,255,255,.18); color: #fff; }
  body.portal .auth input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  body.portal .tabs .chip { background: rgba(255,255,255,.1); color: #fff; }
  body.portal .tabs .chip.on { background: #fff; color: #17110e; }
  body.portal .auth .submit { background: #ff6a33; box-shadow: 0 8px 24px rgba(255,106,51,.35); }
  body.portal .auth .err { color: #ffb08f; }
  .portal-foot { display: none; text-align: center; color: rgba(255,255,255,.5); font-size: 13px; margin: 22px 0 10px; }
  body.portal .portal-foot { display: block; }
  .share-banner { margin: 10px 0 4px; padding: 14px 16px; border-radius: 16px; background: var(--card); border: 2px solid var(--accent); box-shadow: var(--shadow); }
  .share-banner b { display: block; font-size: 16px; margin-bottom: 4px; }
  .share-banner span { color: var(--muted); font-size: 14px; word-break: break-all; }
  body.portal .share-banner { background: rgba(255,255,255,.08); color: #fff; }
  body.portal .share-banner span { color: rgba(255,255,255,.75); }
</style>
</head>
<body>
<header>
  <h1>N<span class="bang">!</span>che <span class="beta">bêta</span></h1>
  <div class="tagline">Les bonnes adresses<br>ne se perdent plus.</div>
  <div class="sub" id="sub">Chargement…</div>
  <div class="userbar hidden" id="userbar"><span id="who"></span><button class="linkbtn" id="logout">Se déconnecter</button></div>
</header>
<div class="share-banner hidden" id="share-banner"><b id="share-title"></b><span id="share-text"></span></div>

<section class="auth hidden" id="auth">
  <div class="tabs">
    <button class="chip on" id="tab-login" type="button">Se connecter</button>
    <button class="chip" id="tab-signup" type="button">Créer un compte</button>
  </div>
  <form id="auth-form" novalidate>
    <label for="f-email">Email</label>
    <input id="f-email" type="email" autocomplete="email" required>
    <label for="f-pass">Mot de passe</label>
    <input id="f-pass" type="password" autocomplete="current-password" required minlength="6">
    <div id="signup-fields" class="hidden">
      <label for="f-pseudo">Pseudo</label>
      <input id="f-pseudo" type="text" autocomplete="nickname" maxlength="30">
      <label for="f-code">Code d'invitation</label>
      <input id="f-code" type="text" autocomplete="off" autocapitalize="characters">
    </div>
    <button class="submit" id="f-submit" type="submit">Se connecter</button>
    <div class="err" id="f-err"></div>
    <div class="hint" id="f-hint">Pas encore de compte ? Il te faut un code d'invitation.</div>
  </form>
</section>
<div class="portal-foot">Sur invitation uniquement · bêta</div>

<div id="app" class="hidden">

<input class="search" id="q" type="search" placeholder="Nom, cuisine, quartier…" autocomplete="off">

<div class="label">Ambiance</div>
<div class="row" id="cats"></div>

<div class="label">Prix et lieu</div>
<div class="row" id="prix"></div>

<div class="bar">
  <span id="count"></span>
  <button class="linkbtn" id="reset">Tout effacer</button>
</div>

<main class="list" id="list"></main>

</div>

<button class="fab hidden" id="random">🎲 On mange où ?</button>

<script>
  const SUPABASE_URL = "https://ckhrhexnldbcbdqxdkmu.supabase.co";
  const SUPABASE_KEY = "sb_publishable_JKbRFpLO_TVeBtjOg7YGeg_CmOOMI-g";

  const MAKE_WEBHOOK = "https://hook.eu1.make.com/724w9nyrng5m99rv8ut45uxarrpgv3pb";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ===== Lien partagé (raccourci iPhone ?add=…, partage Android ?text=…) =====
  function extraireLien(txt) {
    const m = String(txt || "").match(/https?:\/\/(www\.)?instagram\.com\/[^\s"'<>]+/i);
    return m ? m[0] : null;
  }
  function capterPartage() {
    const q = new URLSearchParams(location.search);
    const brut = [q.get("add"), q.get("url"), q.get("text"), q.get("title")].filter(Boolean).join(" ");
    if (!brut) return;
    const lien = extraireLien(brut);
    try { if (lien) sessionStorage.setItem("niche_lien", lien); } catch (e) {}
    history.replaceState(null, "", location.pathname);
    if (!lien) banniere("Lien non reconnu", "Ce partage ne contient pas de lien Instagram.");
  }
  function lienEnAttente() { try { return sessionStorage.getItem("niche_lien"); } catch (e) { return null; } }
  function oublierLien() { try { sessionStorage.removeItem("niche_lien"); } catch (e) {} }
  function banniere(titre, texte) {
    $("share-title").textContent = titre;
    $("share-text").textContent = texte;
    $("share-banner").classList.remove("hidden");
  }
  let envoiEnCours = false;
  async function envoyerPartage(user) {
    const lien = lienEnAttente();
    if (!lien || envoiEnCours) return;
    envoiEnCours = true;
    banniere("Ajout en cours…", lien);
    try {
      const { data: prof, error } = await sb.from("profils").select("token_raccourci").eq("id", user.id).maybeSingle();
      if (error || !prof || !prof.token_raccourci) throw new Error("profil introuvable");
      await fetch(MAKE_WEBHOOK, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ url: lien, token: prof.token_raccourci }).toString()
      });
      oublierLien();
      suivreAjout();
    } catch (e) {
      banniere("Oups, l'envoi a échoué", "Réessaie de partager le reel. (" + (e.message || e) + ")");
    } finally {
      envoiEnCours = false;
    }
  }
  // Vérifie toutes les 5 s si le resto est arrivé (jusqu'à 2 minutes)
  async function suivreAjout() {
    const avant = new Set(restos.map((r) => r.id));
    const debut = Date.now();
    const tick = async () => {
      const ecoule = Math.round((Date.now() - debut) / 1000);
      banniere("On s'en occupe… ⏳", "Lecture du reel et vérification sur Google Maps (" + ecoule + " s). Tu peux retourner sur Instagram, ça continue sans toi.");
      if (currentUser) await load(true);
      const nouveau = restos.find((r) => !avant.has(r.id));
      if (nouveau) {
        banniere("Ajouté à ta liste ✅", nouveau.nom + (nouveau.zone || nouveau.ville ? " · " + (nouveau.zone || nouveau.ville) : ""));
        const el = $("r" + nouveau.id);
        if (el) { el.classList.add("pick"); el.scrollIntoView({ behavior: "smooth", block: "center" }); }
        return;
      }
      if (Date.now() - debut > 120000) {
        banniere("Pas de nouveau resto", "Il est peut-être déjà dans ta liste, ou le reel ne donne pas assez d'infos pour le retrouver.");
        return;
      }
      setTimeout(tick, 5000);
    };
    setTimeout(tick, 5000);
    banniere("Envoyé ✅ On s'en occupe…", "Lecture du reel et vérification sur Google Maps (environ 20 à 40 s). Tu peux retourner sur Instagram.");
  }

  capterPartage();
  const state = { q: "", cats: new Set(), prix: new Set(), ville: "", statut: "" };
  let restos = [];
  let mode = "login";
  let currentUser = null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = (s) => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

  // ===== Connexion / inscription =====
  function setMode(m) {
    mode = m;
    $("tab-login").classList.toggle("on", m === "login");
    $("tab-signup").classList.toggle("on", m === "signup");
    $("signup-fields").classList.toggle("hidden", m !== "signup");
    $("f-submit").textContent = m === "login" ? "Se connecter" : "Créer mon compte";
    $("f-pass").autocomplete = m === "login" ? "current-password" : "new-password";
    $("f-hint").textContent = m === "login" ? "Pas encore de compte ? Il te faut un code d'invitation." : "Le code d'invitation ne marche qu'une seule fois.";
    $("f-err").textContent = "";
  }
  $("tab-login").onclick = () => setMode("login");
  $("tab-signup").onclick = () => setMode("signup");

  function frenchError(e) {
    const m = String((e && e.message) || e || "");
    if (/invalid login credentials/i.test(m)) return "Email ou mot de passe incorrect.";
    if (/already registered|already exists/i.test(m)) return "Un compte existe déjà avec cet email.";
    if (/database error saving new user/i.test(m)) return "Code d'invitation invalide ou déjà utilisé, ou pseudo déjà pris.";
    if (/password should be at least/i.test(m)) return "Le mot de passe doit faire au moins 6 caractères.";
    if (/invalid.*email|email.*invalid/i.test(m)) return "Cet email n'a pas l'air valide.";
    if (/signups not allowed/i.test(m)) return "Les inscriptions sont fermées pour le moment.";
    return "Oups : " + m;
  }

  $("auth-form").onsubmit = async (ev) => {
    ev.preventDefault();
    const email = $("f-email").value.trim();
    const password = $("f-pass").value;
    const err = $("f-err");
    err.textContent = "";
    if (!email || !password) { err.textContent = "Remplis ton email et ton mot de passe."; return; }
    if (password.length < 6) { err.textContent = "Le mot de passe doit faire au moins 6 caractères."; return; }
    let pseudo = "", code = "";
    if (mode === "signup") {
      pseudo = $("f-pseudo").value.trim();
      code = $("f-code").value.trim().toUpperCase();
      if (!pseudo) { err.textContent = "Choisis un pseudo."; return; }
      if (!code) { err.textContent = "Entre ton code d'invitation."; return; }
    }
    const btn = $("f-submit");
    btn.disabled = true;
    try {
      const res = mode === "login"
        ? await sb.auth.signInWithPassword({ email, password })
        : await sb.auth.signUp({ email, password, options: { data: { pseudo, code } } });
      if (res.error) throw res.error;
      if (mode === "signup" && !res.data.session) {
        err.textContent = "Compte créé ! Connecte-toi maintenant.";
        setMode("login");
      }
    } catch (e) {
      err.textContent = frenchError(e);
    } finally {
      btn.disabled = false;
    }
  };

  $("logout").onclick = async () => { await sb.auth.signOut(); };

  function showAuth() {
    currentUser = null;
    restos = [];
    document.body.classList.add("portal");
    $("auth").classList.remove("hidden");
    $("app").classList.add("hidden");
    $("random").classList.add("hidden");
    $("userbar").classList.add("hidden");
    $("sub").textContent = "On mange où ce soir ? Connecte-toi pour retrouver tes adresses.";
    setTimeout(() => {
      if (!currentUser && lienEnAttente()) banniere("Un resto t'attend 🍽️", "Connecte-toi : on l'ajoute à ta liste juste après.");
    }, 1000);
  }

  async function showApp(user) {
    if (currentUser && currentUser.id === user.id) return;
    currentUser = user;
    document.body.classList.remove("portal");
    $("auth").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("random").classList.remove("hidden");
    $("userbar").classList.remove("hidden");
    $("who").textContent = user.email;
    const { data: prof } = await sb.from("profils").select("pseudo").eq("id", user.id).maybeSingle();
    if (prof && prof.pseudo) $("who").textContent = "Connecté : " + prof.pseudo;
    await load();
    envoyerPartage(user);
  }

  sb.auth.onAuthStateChange((_event, session) => {
    if (session && session.user) showApp(session.user);
    else showAuth();
  });

  // ===== Mes restos =====
  async function load(silencieux) {
    if (!silencieux) $("sub").textContent = "Chargement…";
    try {
      const { data, error } = await sb
        .from("enregistrements")
        .select("statut, avis, date_ajout, restos(*)")
        .order("date_ajout", { ascending: false });
      if (error) throw error;
      restos = (data || []).filter((e) => e.restos).map((e) => ({ ...e.restos, statut: e.statut, avis: e.avis, date_ajout: e.date_ajout }));
      $("sub").textContent = restos.length + (restos.length > 1 ? " adresses niche à tester" : " adresse niche à tester");
      buildFilters();
      render();
    } catch (e) {
      $("sub").textContent = "";
      $("list").innerHTML = '<div class="msg">Impossible de charger tes restos.<br><small>' + esc(e.message || e) + "</small></div>";
    }
  }

  function chip(label, on, onClick) {
    const b = document.createElement("button");
    b.className = "chip" + (on ? " on" : "");
    b.textContent = label;
    b.onclick = onClick;
    return b;
  }

  function select(placeholder, values, current, onChange) {
    const s = document.createElement("select");
    s.className = "chip" + (current ? " on" : "");
    s.innerHTML = '<option value="">' + esc(placeholder) + "</option>" + values.map((v) => '<option value="' + esc(v) + '"' + (v === current ? " selected" : "") + ">" + esc(v) + "</option>").join("");
    s.onchange = () => onChange(s.value);
    return s;
  }

  function buildFilters() {
    const cats = [...new Set(restos.flatMap((r) => r.categories || []))].sort();
    const villes = [...new Set(restos.map((r) => r.zone || r.ville).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr", { numeric: true }));
    const statuts = [...new Set(restos.map((r) => r.statut).filter(Boolean))].sort();

    const c = $("cats");
    c.innerHTML = "";
    if (!cats.length) c.innerHTML = '<span class="sub">Aucune catégorie pour l\'instant</span>';
    cats.forEach((cat) => c.append(chip(cat, state.cats.has(cat), () => { toggle(state.cats, cat); buildFilters(); render(); })));

    const p = $("prix");
    p.innerHTML = "";
    [1, 2, 3, 4].forEach((n) => p.append(chip("€".repeat(n), state.prix.has(n), () => { toggle(state.prix, n); buildFilters(); render(); })));
    p.append(select("Ville", villes, state.ville, (v) => { state.ville = v; buildFilters(); render(); }));
    p.append(select("Statut", statuts, state.statut, (v) => { state.statut = v; buildFilters(); render(); }));
  }

  function toggle(set, v) { set.has(v) ? set.delete(v) : set.add(v); }

  function filtered() {
    const q = norm(state.q);
    return restos.filter((r) => {
      if (q && !norm([r.nom, r.cuisine, r.adresse, r.ville, r.zone].join(" ")).includes(q)) return false;
      if (state.cats.size && !(r.categories || []).some((c) => state.cats.has(c))) return false;
      if (state.prix.size && !state.prix.has(r.niveau_prix)) return false;
      if (state.ville && (r.zone || r.ville) !== state.ville) return false;
      if (state.statut && r.statut !== state.statut) return false;
      return true;
    });
  }

  function priceHtml(n) {
    if (!n) return '<span class="price"><span class="off">€€€€</span></span>';
    return '<span class="price">' + "€".repeat(n) + '<span class="off">' + "€".repeat(4 - n) + "</span></span>";
  }

  function render() {
    const items = filtered();
    $("count").textContent = items.length + " resto" + (items.length > 1 ? "s" : "");
    const list = $("list");
    if (!items.length) {
      list.innerHTML = '<div class="empty">Aucun resto ne correspond. Essaie d\'enlever un filtre.</div>';
      return;
    }
    list.innerHTML = items.map((r) => {
      const statut = r.statut ? '<span class="tag status' + (r.statut === "testé" ? " done" : "") + '">' + esc(r.statut) + "</span>" : "";
      const tags = (r.categories || []).map((c) => '<span class="tag">' + esc(c) + "</span>").join("");
      const sub = [r.cuisine, r.zone || r.ville].filter(Boolean).map(esc).join(" · ");
      return (
        '<article class="card" id="r' + r.id + '">' +
          '<div class="top"><div class="name">' + esc(r.nom) + "</div>" + priceHtml(r.niveau_prix) + "</div>" +
          '<div class="meta">' + sub + "</div>" +
          (r.adresse ? '<div class="meta">' + esc(r.adresse) + "</div>" : "") +
          '<div class="tags">' + statut + tags + "</div>" +
          '<div class="actions">' +
            (r.lien_maps ? '<a class="go" href="' + esc(r.lien_maps) + '" target="_blank" rel="noopener">Y aller</a>' : "") +
            (r.lien_instagram ? '<a class="ig" href="' + esc(r.lien_instagram) + '" target="_blank" rel="noopener">Revoir le reel</a>' : "") +
          "</div>" +
        "</article>"
      );
    }).join("");
  }

  $("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
  $("reset").onclick = () => {
    state.q = ""; state.cats.clear(); state.prix.clear(); state.ville = ""; state.statut = "";
    $("q").value = "";
    buildFilters(); render();
  };
  $("random").onclick = () => {
    const items = filtered();
    if (!items.length) return;
    const r = items[Math.floor(Math.random() * items.length)];
    document.querySelectorAll(".card.pick").forEach((c) => c.classList.remove("pick"));
    const el = $("r" + r.id);
    el.classList.add("pick");
    el.scrollIntoView({ behavior: "smooth", block: "center" });
  };

</script>
</body>
</html>
